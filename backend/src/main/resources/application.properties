# ===================================================================
# Factory Management System - Application Configuration
# ===================================================================

# Database Configuration (Supports Environment Variables for Deployment & Aiven MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/factory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server Configuration
server.port=${PORT:8080}

# JWT Authentication
jwt.secret=${JWT_SECRET:MyFactoryManagementSuperSecretKeyThatIsAtLeast256BitsLong2024!}
jwt.expiration=${JWT_EXPIRATION:36000000}
